<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to MACOM Chatbot</title>
    <link href="./static/assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./static/Login_style.css">
</head>
<script nonce="{{ nonce }}" src="./static/app.js"></script>
<body>
    <!-- Section: Design Block -->
    <section class="background-radial-gradient overflow-hidden">
      <div class="container px-4 py-5 px-md-5 text-center text-lg-center my-3">
        <div class="row gx-lg-5 d-flex justify-content-center align-items-center mt-5 mb-5">
          <div class="col-lg-4 mb-5 mb-lg-0">
            <img alt="chatbot-icon" src="./static/MACOM Bot.png" class="chatbot-logo" />
            <p class="mb-4 intro-text">
              Unlocking the AI Experience!
            </p>
          </div>
    
          <div class="col-lg-5 mb-5 mb-lg-0 position-relative">
            <div class="card bg-glass">
              <div class="card-body px-4 py-5 px-md-5">
                <div class="page-title">
                  <h3>Sign in to Chat</h3>
                </div>
                <form>
                  <!-- Submit button -->
                  <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-chatbot-login btn-block mb-4 w-100">
                    <strong>Sign in</strong>
                  </button>
                </form>
              </div>
            </div>
            <div class="login-footer">
              <p class="footer-text">Powered by <a class="footer-link" href="https://macomsolutions.com/" target="_blank"><strong>MACOM</strong></a></p>
            </div>
          </div>
        </div>
      </div>
    </section>
</body>
</html>
